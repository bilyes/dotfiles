[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.74999998323619366
    capsule = true
    capsule_opacity = 0.0
    end = [ "media", "tray", "timer", "ocr", "weather", "cpu", "temp", "notifications", "network", "volume", "battery", "session" ]
    font_family = "JetBrainsMono Nerd Font"
    margin_ends = 1
    scale = 1.1000000089406967
    start = [ "workspaces" ]
    widget_spacing = 2

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
up = [ "Up", "Ctrl+k" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 304.0
    cx = 1280.0
    cy = 720.0
    output = "HDMI-A-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        font_family = "JetBrainsMono Nerd Font"
        shadow = true

[nightlight]
enabled = true
force = true

[plugin_settings."nightwatch75/file-search"]
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [ "nightwatch75/file-search", "noctalia/timer", "fel/ocr", "blackbartblues/keymap" ]

[shell]
launch_apps_custom_command = "uwsm app -- $CMD"

[shell.animation]
speed = 2.0000000298023224

[shell.launcher]
categories = false
default_view = "all"
layout = "simple"

[shell.screenshot]
annotate = true

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%H:%M %b %e}"

[widget.control-center]
enabled = false

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

# The OCR keybinding sends its command to this widget, so it must stay on the bar
[widget.ocr]
type = "fel/ocr:ocr"

[widget.timer]
type = "noctalia/timer:bar"

[widget.weather]
show_condition = false
