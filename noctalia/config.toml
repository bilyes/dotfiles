[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.75
    capsule = true
    capsule_opacity = 0.0
    end = [ "media", "tray", "timer", "ocr", "weather", "cpu", "temp", "notifications", "network", "volume", "battery", "session" ]
    font_family = "JetBrainsMono Nerd Font"
    margin_ends = 1
    scale = 1.1
    start = [ "workspaces" ]
    widget_spacing = 2

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
up = [ "Up", "Ctrl+k" ]

[nightlight]
enabled = true
force = true

[plugin_settings."nightwatch75/file-search"]
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [ "nightwatch75/file-search", "noctalia/timer", "fel/ocr", "blackbartblues/keymap" ]

[shell]
launch_apps_custom_command = "uwsm app -- $CMD"

[shell.animation]
speed = 2.0

[shell.launcher]
categories = false
default_view = "all"
layout = "simple"

[shell.screenshot]
annotate = true

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%H:%M %b %e}"

[widget.control-center]
enabled = false

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

# The OCR keybinding sends its command to this widget, so it must stay on the bar
[widget.ocr]
type = "fel/ocr:ocr"

[widget.timer]
type = "noctalia/timer:bar"

[widget.weather]
show_condition = false
