# vim:set ft=tmux:
# The status bar's roles (status/bar.conf) in Noctalia's colors, which its tmux template writes to
# themes/noctalia.conf. Set without -F, the roles keep pointing at @noctalia_*, so the bar follows
# each palette Noctalia's apply.sh sources into running servers. Does nothing if a palette listed
# before this one in tmux.conf already applies.
%if "#{&&:#{!:#{@bar_palette}},#{@noctalia_surface}}"
set -g @bar_palette "noctalia"

set -g @bar_bg "#{@noctalia_surface_container_low}"
set -g @bar_surface "#{@noctalia_surface_container_high}"
set -g @bar_surface_strong "#{@noctalia_surface_container_highest}"
set -g @bar_text "#{@noctalia_on_surface}"
set -g @bar_text_dim "#{@noctalia_on_surface_variant}"
set -g @bar_muted "#{@noctalia_outline_variant}"
set -g @bar_on_muted "#{@noctalia_on_surface}"
set -g @bar_accent "#{@noctalia_primary}"
set -g @bar_on_accent "#{@noctalia_on_primary}"
set -g @bar_highlight "#{@noctalia_secondary_container}"
set -g @bar_on_highlight "#{@noctalia_on_secondary_container}"
set -g @bar_notice "#{@noctalia_tertiary_container}"
set -g @bar_on_notice "#{@noctalia_on_tertiary_container}"
set -g @bar_alert "#{@noctalia_error_container}"
set -g @bar_on_alert "#{@noctalia_on_error_container}"
%endif
