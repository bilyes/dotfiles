# vim:set ft=tmux:
# The status bar: rounded tabs, each window's name then its number, an icon on the tab of a zoomed
# window, then COPY while the pane is in copy mode and the session name. Its colors are the
# @bar_* roles, which a palette (palettes/*.conf) points at a theming system's colors. Without a
# palette, as when Catppuccin draws the bar, this does nothing.
#
# The roles are looked up each time the bar is drawn, so the bar follows a palette that its
# theming system updates in running servers. Every segment sets its own colors and attributes, so
# the window-status styles a theme sets don't show around the rounded ends.
#
# The roles, all colors (the @bar_on_* ones for text drawn on the role of the same name):
#   @bar_bg                               the bar's background
#   @bar_surface                          other windows' names, the session name
#   @bar_surface_strong                   the current window's name
#   @bar_text, @bar_text_dim              text on those: the current window's and session's, and
#                                         other windows'
#   @bar_muted, @bar_on_muted             other windows' numbers
#   @bar_accent, @bar_on_accent           the current window's number, the session icon
#   @bar_highlight, @bar_on_highlight     COPY
#   @bar_notice, @bar_on_notice           the number of a window with activity
#   @bar_alert, @bar_on_alert             the number of a window with a bell, and the session
#                                         icon while the prefix key is active
%if "#{@bar_palette}"
set -g status-style "bg=#{E:@bar_bg},fg=#{E:@bar_text}"

# Nerd Font glyphs: the rounded ends of each segment, and the zoom, copy and session icons
%hidden LEFT="\ue0b6"
%hidden RIGHT="\ue0b4"
%hidden ZOOM_ICON="\U000f004c"
%hidden COPY_ICON="\U000f018f"
%hidden SESSION_ICON="\ue795"

%hidden NAME_BG="#{?window_active,#{E:@bar_surface_strong},#{E:@bar_surface}}"
%hidden NAME_FG="#{?window_active,#{E:@bar_text},#{E:@bar_text_dim}}"
%hidden NUMBER_BG="#{?window_bell_flag,#{E:@bar_alert},#{?window_activity_flag,#{E:@bar_notice},#{?window_active,#{E:@bar_accent},#{E:@bar_muted}}}}"
%hidden NUMBER_FG="#{?window_bell_flag,#{E:@bar_on_alert},#{?window_activity_flag,#{E:@bar_on_notice},#{?window_active,#{E:@bar_on_accent},#{E:@bar_on_muted}}}}"
# none clears the attributes the window-status styles add, then the current window's tab is bold
%hidden TAB="#[none,fg=$NAME_BG,bg=#{E:@bar_bg},#{?window_active,bold,nobold}]$LEFT#[fg=$NAME_FG,bg=$NAME_BG]#W#{?window_zoomed_flag, $ZOOM_ICON,} #[fg=$NUMBER_FG,bg=$NUMBER_BG] #I#[fg=$NUMBER_BG,bg=#{E:@bar_bg}]$RIGHT"
set -g window-status-format "$TAB"
set -g window-status-current-format "$TAB"

# In a #{?...} branch, a comma is written #,
set -g status-right "#{?#{==:#{pane_mode},copy-mode},#[none#,fg=#{E:@bar_highlight}#,bg=#{E:@bar_bg}]$LEFT#[fg=#{E:@bar_on_highlight}#,bg=#{E:@bar_highlight}]$COPY_ICON COPY#[fg=#{E:@bar_highlight}#,bg=#{E:@bar_bg}]$RIGHT ,}"
%hidden SESSION_BG="#{?client_prefix,#{E:@bar_alert},#{E:@bar_accent}}"
%hidden SESSION_FG="#{?client_prefix,#{E:@bar_on_alert},#{E:@bar_on_accent}}"
set -ag status-right "#[none,fg=$SESSION_BG,bg=#{E:@bar_bg}]$LEFT#[fg=$SESSION_FG,bg=$SESSION_BG]$SESSION_ICON #[fg=#{E:@bar_text},bg=#{E:@bar_surface}] #S#[fg=#{E:@bar_surface},bg=#{E:@bar_bg}]$RIGHT"
%endif
