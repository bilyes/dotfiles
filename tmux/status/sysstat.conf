# vim:set ft=tmux:
# Catppuccin status module showing scripts/sysstat.sh's readings, built like the theme's own
# modules (plugins/tmux/status/*.conf). Its module helper reads the theme's separators, so tmux.conf
# sources this once TPM has loaded Catppuccin; with another theme, this does nothing.
%if "#{@thm_fg}"
%hidden MODULE_NAME="sysstat"

set -g "@catppuccin_${MODULE_NAME}_icon" "󰓅 "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_blue}"
# Single quotes leave the variables to sh. tmux expands the colors inside #() before running it.
# No % here: tmux runs the status line through strftime first.
set -g "@catppuccin_${MODULE_NAME}_text" ' #("${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/sysstat.sh" "#{@thm_red}" "#{@thm_fg}")'

source -F "#{d:current_file}/../plugins/tmux/utils/status_module.conf"
%endif
