#set -g default-terminal "tmux-256color"

# Enable transparent background
#set -g pane-active-border-style bg=color0
#set -g pane-border-style bg=color0
set-window-option -g window-active-style bg=terminal
set-window-option -g window-style bg=terminal

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Reaches the system clipboard without pbcopy/wl-copy: with set-clipboard at its default
# (external), tmux sends copies to the terminal as OSC 52, which kitty writes to the clipboard.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# No -c "#{pane_current_path}" on purpose: new panes start in the session's directory (home).
bind-key v split-window -h
bind-key h split-window -v
bind-key N switch-client -n
bind-key P switch-client -p

# neovim's recommendation
set-option -sg escape-time 10

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g status-position top

#set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_session}"
set -g status-left ""

# Requires TPM (install.sh clones it)
# git clone https://github.com/tmux-plugins/tpm "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Noctalia's theme where its tmux template has written one (Linux), else Catppuccin. Catppuccin
# goes in @tpm_plugins because TPM finds @plugin lines by reading this file as text, so it would
# load one even inside a condition.
source-file -qF "#{d:current_file}/themes/noctalia.conf"
if-shell -F "#{@noctalia_surface}" {
  # The session name, in the error colors while the prefix key is active
  set -g status-right "#[fg=#{?client_prefix,#{@noctalia_on_error_container},#{@noctalia_on_primary_container}},bg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_primary_container}}] #S "
} {
  set -g @tpm_plugins "catppuccin/tmux"
}

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

#set -g @catppuccin_status_left_separator  " "
#set -g @catppuccin_status_right_separator ""
#set -g @catppuccin_status_connect_separator "no"

# In single quotes, tmux passes this to sh unexpanded, and sh expands the variable
run '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"'

# Keep this exact line last: Noctalia's tmux template rewrites this file to end with it.
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
