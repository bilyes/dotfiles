#set -g default-terminal "tmux-256color"

# Enable transparent background
#set -g pane-active-border-style bg=color0
#set -g pane-border-style bg=color0
set-window-option -g window-active-style bg=terminal
set-window-option -g window-style bg=terminal

set-window-option -g mode-keys vi
# -N descriptions list the bindings under `prefix ?` (see the popup below)
bind-key -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
# Reaches the system clipboard without pbcopy/wl-copy: with set-clipboard at its default
# (external), tmux sends copies to the terminal as OSC 52, which kitty writes to the clipboard.
bind-key -N "Copy selection and leave copy mode" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# No -c "#{pane_current_path}" on purpose: new panes start in the session's directory (home).
bind-key -N "Split pane side by side" v split-window -h
bind-key -N "Split pane top and bottom" h split-window -v
bind-key -N "Switch to the next session" N switch-client -n
bind-key -N "Switch to the previous session" P switch-client -p

# Fuzzy-find every binding with a description, copy-mode ones included, in a popup; Enter runs it
bind-key -N "Search key bindings" ? run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/keybinds.sh" "#{client_name}"'

# Fuzzy-find every pane/window across sessions, with a live pane preview
bind-key -N "Search panes and windows" f run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/launcher.sh" "#{client_name}"'
# Keep tmux's built-in name-based find-window reachable
bind-key -N "Find window by name" F command-prompt -p "find-window:" "find-window -Z '%%'"

# neovim's recommendation
set-option -sg escape-time 10

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g status-position top

#set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
# COPY while the pane is in copy mode, then the session name. A zoomed pane shows as an icon on
# its window's tab (@catppuccin_window_flags below). In a #{?...} branch, a comma is written #,
set -g status-right "#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_crust}#,bg=#{@thm_yellow}] COPY ,}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g status-left ""

# Requires TPM (install.sh clones it)
# git clone https://github.com/tmux-plugins/tpm "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Noctalia's theme where its tmux template has written one (Linux), else Catppuccin. Catppuccin
# goes in @tpm_plugins because TPM finds @plugin lines by reading this file as text, so it would
# load one even inside a condition.
source-file -qF "#{d:current_file}/themes/noctalia.conf"
if-shell -F "#{@noctalia_surface}" {
  # ZOOM while a pane is zoomed, COPY while the pane is in copy mode, then the session name, in
  # the error colors while the prefix key is active. In a #{?...} branch, a comma is written #,
  set -g status-right "#{?window_zoomed_flag,#[fg=#{@noctalia_on_tertiary_container}#,bg=#{@noctalia_tertiary_container}] ZOOM ,}"
  set -ag status-right "#{?#{==:#{pane_mode},copy-mode},#[fg=#{@noctalia_on_secondary_container}#,bg=#{@noctalia_secondary_container}] COPY ,}"
  set -ag status-right "#[fg=#{?client_prefix,#{@noctalia_on_error_container},#{@noctalia_on_primary_container}},bg=#{?client_prefix,#{@noctalia_error_container},#{@noctalia_primary_container}}] #S "
} {
  set -g @tpm_plugins "catppuccin/tmux"
}

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
# Of the window flag icons, only the zoom one. Catppuccin expands this once when it loads, hence ##.
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_format "##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}"

#set -g @catppuccin_status_left_separator  " "
#set -g @catppuccin_status_right_separator ""
#set -g @catppuccin_status_connect_separator "no"

# In single quotes, tmux passes this to sh unexpanded, and sh expands the variable
run '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"'

# Keep this exact line last: Noctalia's tmux template rewrites this file to end with it.
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
